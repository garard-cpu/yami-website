# The waitlist page is index.html at the root; the app is /app; /api/vision is the photo reader in netlify/functions.
[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# Keep build-time files out of the public site.
[[redirects]]
  from = "/node_modules/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true
