# Yami moved to Cloudflare Pages (https://yami-usc.pages.dev) to drop Netlify's free-plan badge.
# This file only affects the old yami-usc.netlify.app address: every path forwards to the same path on the new site.
# Cloudflare ignores netlify.toml.
[build]
  publish = "."

[[redirects]]
  from = "/*"
  to = "https://yami-usc.pages.dev/:splat"
  status = 301
  force = true
