@keyframes yobFlash{0%{opacity:0}20%{opacity:.95}100%{opacity:0}}
#yob .cam .yhint{position:absolute;top:22px;left:0;right:0;text-align:center;color:#fff;font-family:var(--dsp);font-size:20px;font-weight:900;padding:0 64px;line-height:1.15;text-transform:lowercase}
#yob .scan{position:absolute;left:10%;right:10%;height:4px;background:var(--g);box-shadow:0 0 18px var(--g);top:20%;animation:yobScan 1.2s ease-in-out infinite alternate}
@keyframes yobScan{to{top:68%}}
#yob .res{background:#fff;border:var(--ln);box-shadow:var(--pop);border-radius:26px;padding:14px;color:var(--ik)}
#yob .res .ypill2{display:inline-block;background:var(--bl);color:var(--c);border:var(--ln);border-radius:999px;padding:5px 12px;font-weight:700;font-size:13.5px}
#yob .res .pl{margin:12px 0;border-radius:18px;border:var(--ln);background:#140c0c;aspect-ratio:1.7;display:grid;place-items:center;position:relative}
#yob .res .pl svg{height:90%;width:auto}
#yob .res .sc{position:absolute;right:-8px;top:-12px;width:62px;height:62px;border-radius:50%;border:var(--ln);display:grid;place-items:center;font-family:var(--dsp);font-weight:900;font-size:20px;transform:rotate(10deg);box-shadow:3px 3px 0 var(--ik)}
#yob .res h2{font-family:var(--dsp);font-weight:900;font-size:21px;line-height:1.15;margin:0 0 4px;letter-spacing:-.01em}
#yob .res .ing{color:var(--mu);font-size:14px;line-height:1.45;margin:0 0 12px}
#yob .res .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#yob .res .add{margin-top:12px;background:var(--c);color:#fff;border:var(--ln);border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.4;font-weight:600}
#yob .res .add b{color:var(--g)}
#yob .sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
#yob .sizes button{height:44px;border-radius:14px;background:#fff;font-weight:700;border:var(--ln);color:var(--ik)}
#yob .sizes button[aria-pressed=true]{background:var(--g);box-shadow:3px 3px 0 var(--ik)}
#yob .row2{display:grid;grid-template-columns:1fr 2fr;gap:10px}
#yob .ybig{font-family:var(--dsp);font-weight:900;font-size:96px;line-height:1;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
#yob .confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#yob .confetti i{position:absolute;top:-40px;border:2px solid var(--ik);animation:yobFall linear forwards}
@keyframes yobFall{to{transform:translateY(900px) rotate(320deg)}}
#yob .week{display:flex;justify-content:space-between;margin:16px 0 6px}
#yob .week div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;text-transform:lowercase}
#yob .week span{width:32px;height:32px;border-radius:50%;background:#fff;border:2px solid var(--ik);transition:background .3s,transform .3s}
#yob .week span.on{background:var(--g);transform:scale(1.08)}
#yob .week span.yrest{background:transparent;border-style:dashed}
#yob .yreply{margin-top:12px;background:var(--bl);border:var(--ln);border-radius:16px;padding:12px 14px;font-weight:600;font-size:15px;line-height:1.4}
#yob .yfield{width:100%;height:56px;border-radius:16px;border:var(--ln);background:#fff;padding:0 16px;font:inherit;font-size:17px;color:var(--ik)}
#yob .yfield:focus{outline:none;box-shadow:var(--pop)}
#yob label.ylbl{display:block;font-weight:700;font-size:14px;margin:14px 0 6px;text-transform:lowercase}
#yob .ychips{display:flex;flex-wrap:wrap;gap:8px}
#yob .ychip{border-radius:999px;padding:9px 14px;background:#fff;font-weight:600;font-size:14.5px;border:var(--ln);color:var(--ik)}
#yob .ychip[aria-pressed=true]{background:var(--g);box-shadow:3px 3px 0 var(--ik)}
#yob .err{color:var(--c);font-weight:700;font-size:14px;margin:8px 0 0}
#yob .ybubble{background:#fff;border:var(--ln);box-shadow:var(--pop);border-radius:20px;padding:14px 16px;font-weight:600;font-size:16px;line-height:1.35;color:var(--ik)}
#yob button:focus-visible,#yob input:focus-visible{outline:3px solid var(--g);outline-offset:2px}
#yob .center{text-align:center}
#yob .yart{display:block;width:84%;height:auto;margin:auto}
#yob img.yart{width:100%;height:100%;object-fit:cover;border-radius:14px}
#yob .phone img.yart,#yob .cam img.yart{width:100%;height:100%;border-radius:0}
#yob .yart.sm{width:44%}
#yob .yart.cam{width:80%}
#yob .res .pl .yart{height:92%;width:auto}
#yob .res .pl img.yart{width:100%;height:100%;border-radius:15px}
#yob .mcard .pl{overflow:hidden}
#yob .yspots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:6px}
#yob .yspots .ychip{padding:7px 12px;font-size:13.5px;text-transform:lowercase}
#yob .ybreak{display:flex;flex-direction:column;gap:10px}
#yob .ybrow{display:flex;gap:14px;align-items:center;border:2.5px solid #160909;border-radius:16px;padding:10px 14px;box-shadow:3px 3px 0 #160909}
#yob .yb0{background:#fff4c2}#yob .yb1{background:#ffe6ee}#yob .yb2{background:#e2f4e2}#yob .yb3{background:#fff}#yob .ybrow b{flex:none;width:52px;font-family:var(--dsp);font-weight:900;font-size:24px;text-align:center}
#yob .ybrow strong{display:block;font-family:var(--dsp);font-weight:800;font-size:14px;text-transform:lowercase}
#yob .ybrow span{display:block;font-size:13.5px;color:var(--mu);line-height:1.35}
@media (prefers-reduced-motion:reduce){#yob *{animation:none!important;transition:none!important}}
</style>
